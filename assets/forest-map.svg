<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">森と星見の泉をたどる古地図</title>
  <desc id="desc">古い羊皮紙に描かれた森、小道、泉、コンパス。旅立ちから星見の泉へ道が続いています。</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#ead9ad"/>
      <stop offset="1" stop-color="#d8c18e"/>
    </linearGradient>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="9" r="1.2" fill="#795f36" opacity=".12"/>
      <circle cx="32" cy="29" r="1" fill="#795f36" opacity=".1"/>
      <path d="M14 40l7-2M35 7l5 1" stroke="#795f36" stroke-width=".8" opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#392a18" flood-opacity=".18"/>
    </filter>
    <g id="tree">
      <path d="M0 42h8V27h11v15h8V18h10v24h8V29h10v13h7v8H0z" fill="#405c3f"/>
      <path d="M5 26l8-16 8 16M21 24l10-20 10 20M37 28l8-14 8 14" fill="#577449" stroke="#354b36" stroke-width="2" stroke-linejoin="round"/>
      <path d="M32 50v-12" stroke="#72583a" stroke-width="5"/>
    </g>
    <g id="pine">
      <path d="M20 0L3 20h10L0 36h13v14h14V36h13L30 20h10z" fill="#466445" stroke="#304a38" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 50v8" stroke="#765c3d" stroke-width="5"/>
    </g>
    <g id="spark">
      <path d="M0-10L3-3 10 0 3 3 0 10-3 3-10 0-3-3z" fill="#fff2c9" stroke="#9c7844" stroke-width="1.5"/>
    </g>
  </defs>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="964" height="584" rx="20" fill="url(#paper)" stroke="#967646" stroke-width="4"/>
    <rect x="32" y="32" width="936" height="556" rx="13" fill="url(#grain)" stroke="#b0925f" stroke-width="1.5"/>
    <path d="M65 117c120-45 191 32 298-14s168-12 244 27 164 47 318-15M73 482c132 24 199-43 319-13s218-54 355-14 160 33 185 11" fill="none" stroke="#a98c5c" stroke-width="2" opacity=".45" stroke-dasharray="5 8"/>
    <path d="M128 385C204 361 220 305 285 310c56 4 50 67 110 61 73-8 67-97 142-109 63-10 73 53 129 47 59-7 69-75 148-82" fill="none" stroke="#f0e1b9" stroke-width="26" stroke-linecap="round"/>
    <path d="M128 385C204 361 220 305 285 310c56 4 50 67 110 61 73-8 67-97 142-109 63-10 73 53 129 47 59-7 69-75 148-82" fill="none" stroke="#8a7047" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10"/>
    <path d="M697 386c-12-53 19-93 16-130s-41-63-25-111 57-49 80-75" fill="none" stroke="#6f9c9b" stroke-width="15" opacity=".6" stroke-linecap="round"/>
    <path d="M697 386c-12-53 19-93 16-130s-41-63-25-111 57-49 80-75" fill="none" stroke="#dfebd6" stroke-width="5" opacity=".9" stroke-linecap="round"/>
    <g opacity=".92">
      <use href="#tree" x="94" y="171"/><use href="#pine" x="185" y="198"/><use href="#tree" x="278" y="145"/>
      <use href="#pine" x="383" y="186"/><use href="#tree" x="460" y="120"/><use href="#pine" x="544" y="184"/>
      <use href="#tree" x="629" y="125"/><use href="#pine" x="783" y="185"/><use href="#tree" x="852" y="139"/>
      <use href="#pine" x="107" y="431"/><use href="#tree" x="220" y="454"/><use href="#pine" x="343" y="415"/>
      <use href="#tree" x="489" y="446"/><use href="#pine" x="612" y="431"/><use href="#tree" x="772" y="445"/>
      <use href="#pine" x="866" y="392"/>
    </g>
    <g fill="#756244" font-family="serif" font-size="19" font-style="italic" letter-spacing="1">
      <text x="87" y="402">旅立ちの野</text>
      <text x="371" y="400">木漏れ日の小径</text>
      <text x="746" y="300">星見の泉</text>
      <text x="126" y="139" font-size="14">THE LISTENERS' FOREST</text>
    </g>
    <g transform="translate(132 385)">
      <circle r="18" fill="#b86b47" stroke="#f8edcb" stroke-width="5"/>
      <path d="M0-11l4 11-4 11-4-11z" fill="#fff1c9"/>
      <text x="-5" y="37" fill="#6d5738" font-family="serif" font-size="13">YOU</text>
    </g>
    <g transform="translate(806 218)">
      <circle r="20" fill="#52798b" stroke="#f8edcb" stroke-width="5"/>
      <path d="M0-14c8 7 8 21 0 28-8-7-8-21 0-28z" fill="#dff0de"/>
      <use href="#spark" x="28" y="-24"/>
      <use href="#spark" x="-30" y="-18" transform="scale(.7)"/>
    </g>
    <g transform="translate(896 88)" stroke="#735c3d" stroke-width="2" fill="none">
      <circle r="42"/><circle r="33" stroke-dasharray="2 4"/>
      <path d="M0-32L8 0 0 32-8 0z" fill="#a94e37" stroke="#735c3d"/>
      <path d="M-32 0L0-8 32 0 0 8z" fill="#e8d9b5"/>
      <circle r="4" fill="#735c3d"/>
      <text x="-5" y="-48" fill="#735c3d" stroke="none" font-family="serif" font-size="13">N</text>
    </g>
    <g transform="translate(500 548)" opacity=".72">
      <path d="M-150 0h300" stroke="#735c3d" stroke-width="2"/>
      <path d="M-150-5v10m75-6v6m75-10v10m75-6v6m75-10v10" stroke="#735c3d" stroke-width="2"/>
      <text x="-37" y="-10" fill="#735c3d" font-family="serif" font-size="12" letter-spacing="3">A TALE IN THE MAKING</text>
    </g>
  </g>
</svg>
