    const content = document.querySelector("#content");

    const toast = document.querySelector("#toast");
    let toastTimer;
    let displayedGroups = [];

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const field = document.createElement("textarea");
        field.value = text;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.append(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        if (!copied) return;
      }
      handleSuccess(button);
    }

    function handleSuccess(button) {
      showToast();
      button.textContent = "完了!";
      button.classList.add("copied");
      setTimeout(() => {
        button.textContent = "コピー";
        button.classList.remove("copied");
      }, 1200);
    }

    function showToast() {
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function renderSelectedGroup() {
      content.replaceChildren();
      if (!displayedGroups.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "スプレッドシートにデータが見つかりませんでした。";
        content.append(empty);
        return;
      }

      const selectedGroup = displayedGroups.find(group => (group.scene ?? group.title) === sceneSelect.value);
      if (!selectedGroup) {
        const prompt = document.createElement("div");
        prompt.className = "empty-state";
        prompt.textContent = "使用シーンを選ぶと、対応するキラコメが表示されます。";
        content.append(prompt);
        return;
      }

      const section = document.createElement("div");
      section.className = "scene-group";
      const heading = document.createElement("h2");
      heading.className = "scene-title";
      heading.textContent = selectedGroup.scene ?? selectedGroup.title;
      const list = document.createElement("div");
      list.className = "message-list";
      for (const item of selectedGroup.items) {
        const value = typeof item === "string" ? item : item.text;
        const row = document.createElement("div");
        row.className = "message-row";
        const snippet = document.createElement("div");
        snippet.className = "message-text";
        snippet.textContent = value;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "コピー";
        button.addEventListener("click", () => copyText(value, button));
        row.append(snippet, button);
        list.append(row);
      }
      section.append(heading, list);
      content.append(section);
    }

    function renderGroups(dataGroups) {
      const selectedScene = sceneSelect.value;
      displayedGroups = dataGroups;
      const sceneNames = [...new Set(dataGroups.map(group => group.scene ?? group.title))];
      sceneSelect.replaceChildren(new Option("使用シーンを選択", ""));
      for (const sceneName of sceneNames) {
        sceneSelect.add(new Option(sceneName, sceneName));
      }
      sceneSelect.value = sceneNames.includes(selectedScene) ? selectedScene : "";
      renderSelectedGroup();
    }

    // Retain a snapshot for offline viewing; replace it with fresh sheet data when available.
    renderGroups(groups.map(group => ({scene: group.title, items: group.items})));
    sceneSelect.addEventListener("change", renderSelectedGroup);
    window.receiveTanuData = dataGroups => {
      renderGroups(dataGroups);
      syncStatus.textContent = "最新データを表示中です ᐢ⓿ᴥ⓿ᐢ";
    };
    const dataScript = document.createElement("script");
    dataScript.src = "https://script.google.com/macros/s/AKfycbzEgYycRnLD5TRh2oqXcf0uimKFQN_3RL9N3mc9ayJmxJRuJCsloAv2ea_94vPNStY5Xw/exec?data=1";
    dataScript.onerror = () => {
      syncStatus.textContent = "最新データを取得できません。GASの公開設定とデプロイを確認してください。";
    };
    document.head.append(dataScript);
  </script>
  <script src="../assets/site.js" defer></script>
</body>
</html>
